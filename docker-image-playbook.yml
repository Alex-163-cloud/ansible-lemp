---
- name: Build custom Docker image
  hosts: localhost
  connection: local
  become: true

  tasks:
    - name: Build custom nginx image
      community.docker.docker_image:
        name: my-nginx
        tag: v1.0
        source: build
        build:
          path: /home/user/ansible-lemp/docker-custom
        state: present

    - name: Start custom nginx container
      community.docker.docker_container:
        name: my-nginx-container
        image: my-nginx:v1.0
        state: started
        ports:
          - "8091:80"
        restart_policy: unless-stopped

    - name: Test custom image
      ansible.builtin.uri:
        url: http://localhost:8091
        return_content: true
      register: response

    - name: Show response
      ansible.builtin.debug:
        msg: "{{ response.content }}"
