---
- name: Deploy MongoDB
  hosts: localhost
  connection: local
  become: true

  vars:
    mongodb_version: "7.0"
    mongodb_net_port: 27017
    mongodb_net_bindip: 127.0.0.1
    mongodb_storage_dbpath: /var/lib/mongodb
    mongodb_pymongo_from_pip: false
    mongodb_pymongo_pip_version: 4.6.0

  roles:
    - role: green.mongodb
