---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install PHP packages
  apt:
    name: "{{ php_packages }}"
    state: present

- name: Ensure PHP-FPM is running and enabled
  service:
    name: "{{ php_service_name }}"
    state: started
    enabled: yes
