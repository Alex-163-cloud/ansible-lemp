---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install PHP packages
  ansible.builtin.apt:
    name: "{{ php_packages }}"
    state: present

- name: Ensure PHP-FPM is running and enabled
  ansible.builtin.service:
    name: "{{ php_service_name }}"
    state: started
    enabled: true
