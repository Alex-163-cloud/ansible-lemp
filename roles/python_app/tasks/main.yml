---
# ============ Установка Python и pip ============
- name: Update apt cache (Debian)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == 'Debian'
  tags: [python_app, install]

- name: Install Python packages (Debian)
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - python3-venv
    state: present
  when: ansible_facts['os_family'] == 'Debian'
  tags: [python_app, install]

- name: Install Python packages (RedHat)
  dnf:
    name:
      - python3
      - python3-pip
    state: present
  when: ansible_facts['os_family'] == 'RedHat'
  tags: [python_app, install]

# ============ Создание директории приложения ============
- name: Create app directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    ansible.builtin.group: "{{ app_group }}"
    mode: '0755'
  tags: [python_app, deploy]

# ============ Копирование файлов приложения ============
- name: Copy application files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ app_dir }}/"
    owner: "{{ app_user }}"
    ansible.builtin.group: "{{ app_group }}"
    mode: '0644'
  loop:
    - app.py
    - requirements.txt
  tags: [python_app, deploy]

# ============ Создание virtualenv ============
- name: Create virtualenv
  pip:
    name: pip
    state: latest
    virtualenv: "{{ app_venv }}"
    virtualenv_command: "python{{ python_version }} -m venv"
  become_user: "{{ app_user }}"
  tags: [python_app, deploy]

# ============ Установка зависимостей ============
- name: Install requirements
  pip:
    requirements: "{{ app_dir }}/requirements.txt"
    virtualenv: "{{ app_venv }}"
  become_user: "{{ app_user }}"
  tags: [python_app, deploy]

# ============ Конфиг приложения ============
- name: Deploy app config
  ansible.builtin.template:
    src: app.env.j2
    dest: "{{ app_dir }}/app.env"
    owner: "{{ app_user }}"
    ansible.builtin.group: "{{ app_group }}"
    mode: '0644'
  notify: Restart python_app
  tags: [python_app, config]
