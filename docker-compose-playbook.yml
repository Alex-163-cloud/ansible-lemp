---
- name: Deploy via docker_compose_v2
  hosts: localhost
  connection: local
  become: true

  tasks:
    - name: Deploy docker-compose
      community.docker.docker_compose_v2:
        project_src: /home/user/ansible-lemp/docker-compose
        state: present

    - name: Test compose service
      ansible.builtin.uri:
        url: http://localhost:8092
        return_content: true
      register: response

    - name: Show response
      ansible.builtin.debug:
        msg: "{{ response.content }}"
