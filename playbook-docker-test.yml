---
- name: Test dynamic inventory with Docker containers
  hosts: all
  gather_facts: false

  tasks:
    - name: Ping container (raw, no Python required)
      ansible.builtin.raw: echo "Hello from $(hostname)"
      register: result
      changed_when: false
      ignore_errors: true

    - name: Show result
      ansible.builtin.debug:
        var: result.stdout_lines
      when: result is defined
