services:
  web:
    image: nginx:latest
    container_name: compose-nginx
    ports:
      - "8092:80"
    volumes:
      - ./html:/usr/share/nginx/html
    networks:
      - compose-net

  redis:
    image: redis:alpine
    container_name: compose-redis
    networks:
      - compose-net

networks:
  compose-net:
    driver: bridge
