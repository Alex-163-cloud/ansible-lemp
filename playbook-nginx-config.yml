---
- name: Configure Nginx with handler
  hosts: webservers
  become: yes

  tasks:
    - name: Create custom index.html
      copy:
        content: "<h1>Hello from Ansible!</h1>\n"
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'
      notify: Reload nginx

    - name: Create custom nginx config
      copy:
        content: |
          server {
              listen 80 default_server;
              server_name _;
              root /var/www/html;
              index index.html index.php;
          }
        dest: /etc/nginx/sites-available/default
        owner: root
        group: root
        mode: '0644'
      notify: Reload nginx

  handlers:
    - name: Reload nginx
      service:
        name: nginx
        state: reloaded
