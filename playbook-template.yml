---
- name: Deploy templated index.html
  hosts: webservers
  become: yes

#  vars:
 #   page_title: "Production Server 1"
  #  deploy_env: "development"

  tasks:
    - name: Deploy index.html from template
      template:
        src: templates/index.html.j2
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'
      notify: Reload nginx

    - name: Show deployment info
      debug:
        msg: "Deployed to {{ inventory_hostname }} in {{ deploy_env }} environment"

  handlers:
    - name: Reload nginx
      service:
        name: nginx
        state: reloaded
