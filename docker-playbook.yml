---
- name: Deploy Docker containers via Ansible
  hosts: localhost
  connection: local
  become: true

  tasks:
    - name: Create Docker network
      community.docker.docker_network:
        name: ansible-net
        state: present

    - name: Create Docker volume
      community.docker.docker_volume:
        name: ansible-www
        state: present

    - name: Start nginx container
      community.docker.docker_container:
        name: ansible-nginx
        image: nginx:latest
        state: started
        restart_policy: always
        ports:
          - "8090:80"               # ← 8090 вместо 8080
        volumes:
          - "ansible-www:/usr/share/nginx/html"
        networks:
          - name: ansible-net
        healthcheck:
          test: ["CMD", "curl", "-f", "http://localhost/"]
          interval: 10s
          timeout: 3s
          retries: 3

    - name: Wait for nginx to be ready
      ansible.builtin.uri:
        url: http://localhost:8090   # ← 8090
        return_content: true
      register: nginx_response
      retries: 5
      delay: 3
      until: nginx_response.status == 200

    - name: Show nginx status
      ansible.builtin.debug:
        msg: "Nginx is up! HTTP {{ nginx_response.status }}"
