---
stages:
  - lint
  - syntax
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  ANSIBLE_FORCE_COLOR: "true"
  ANSIBLE_LOCAL_TEMP: /tmp/.ansible-local
  ANSIBLE_REMOTE_TMP: /tmp/.ansible-remote

cache:
  paths:
    - .cache/pip
    - .ansible/galaxy_cache/

.ansible_base:
  image: python:3.12-slim-bookworm
  before_script:
    - apt-get update && apt-get install -y git
    - python3 -m pip install --upgrade pip
    - python3 -m pip install ansible-core ansible-lint
    - ansible-galaxy install -r requirements.yml

ansible-lint:
  stage: lint
  extends: .ansible_base
  script:
    - ansible-lint playbook-lemp.yml playbook-multi-os.yml docker-playbook.yml

syntax-check:
  stage: syntax
  extends: .ansible_base
  script:
    - ansible-playbook -i inventory.ini playbook-lemp.yml --syntax-check
    - ansible-playbook -i inventory-ssh.ini playbook-multi-os.yml --syntax-check

molecule-test:
  stage: test
  image: python:3.12-slim-bookworm
  services:
    - name: docker:26-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    ANSIBLE_REMOTE_TMP: /tmp/.ansible-remote
  before_script:
    - apt-get update && apt-get install -y git docker.io
    - python3 -m pip install --upgrade pip
    - python3 -m pip install ansible-core molecule "molecule-plugins[docker]"
    - ansible-galaxy install -r requirements.yml
    - printf '%s\n' "$ANSIBLE_VAULT_PASSWORD" > /tmp/vault_pass.txt
  script:
    - cd roles/$ROLE
    - molecule test
  after_script:
    - rm -f /tmp/vault_pass.txt
  parallel:
    matrix:
      - ROLE: [nginx, mysql, php, python_app]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
